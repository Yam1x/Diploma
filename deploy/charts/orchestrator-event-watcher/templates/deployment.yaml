apiVersion: apps/v1
kind: Deployment
metadata:
  name: diploma-orchestrator-event-watcher
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: diploma-orchestrator-event-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diploma-orchestrator-event-watcher
    spec:
      serviceAccountName: diploma-orchestrator-event-watcher
      containers:
        - name: watcher
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- range .Values.command }}
            - {{ . | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: diploma-orchestrator-event-watcher-config

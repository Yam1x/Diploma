  ORCHESTRATOR_S3_BACKUPPER_IMAGE_REPOSITORY: {{ .Values.config.s3Backupper.image.repository | quote }}
  ORCHESTRATOR_S3_BACKUPPER_IMAGE_TAG: {{ .Values.config.s3Backupper.image.tag | quote }}
  ORCHESTRATOR_S3_BACKUPPER_IMAGE_PULL_POLICY: {{ .Values.config.s3Backupper.image.pullPolicy | quote }}
  ORCHESTRATOR_S3_BACKUPPER_CHART_REPOSITORY_URL: {{ .Values.config.s3Backupper.chart.repositoryUrl | quote }}

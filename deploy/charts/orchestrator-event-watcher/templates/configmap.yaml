  ORCHESTRATOR_S3_RESTORER_IMAGE_TAG: {{ .Values.config.s3Restorer.image.tag | quote }}
  ORCHESTRATOR_S3_RESTORER_IMAGE_PULL_POLICY: {{ .Values.config.s3Restorer.image.pullPolicy | quote }}
  ORCHESTRATOR_S3_RESTORER_CHART_REPOSITORY_URL: {{ .Values.config.s3Restorer.chart.repositoryUrl | quote }}
  ORCHESTRATOR_S3_RESTORER_CHART_REF: {{ .Values.config.s3Restorer.chart.ref | quote }}

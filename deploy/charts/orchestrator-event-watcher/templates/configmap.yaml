  ORCHESTRATOR_DB_BACKUPPER_IMAGE_REPOSITORY: {{ .Values.config.dbBackupper.image.repository | quote }}
  ORCHESTRATOR_DB_BACKUPPER_IMAGE_TAG: {{ .Values.config.dbBackupper.image.tag | quote }}
  ORCHESTRATOR_DB_BACKUPPER_IMAGE_PULL_POLICY: {{ .Values.config.dbBackupper.image.pullPolicy | quote }}
  ORCHESTRATOR_DB_BACKUPPER_CHART_REPOSITORY_URL: {{ .Values.config.dbBackupper.chart.repositoryUrl | quote }}
  ORCHESTRATOR_DB_BACKUPPER_CHART_REF: {{ .Values.config.dbBackupper.chart.ref | quote }}
  ORCHESTRATOR_DB_BACKUPPER_CHART_PATH: {{ .Values.config.dbBackupper.chart.path | quote }}

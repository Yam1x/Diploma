apiVersion: apps/v1
kind: Deployment
metadata:
  name: diploma-orchestrator-ui
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: diploma-orchestrator-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diploma-orchestrator-ui
    spec:
      containers:
        - name: ui
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/env.js
              subPath: env.js
      volumes:
        - name: runtime-config
          configMap:
            name: diploma-orchestrator-ui-config

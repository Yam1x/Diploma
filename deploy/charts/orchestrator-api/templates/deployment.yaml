apiVersion: apps/v1
kind: Deployment
metadata:
  name: diploma-orchestrator-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: diploma-orchestrator-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diploma-orchestrator-api
    spec:
      serviceAccountName: diploma-orchestrator-api
      containers:
        - name: api
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: diploma-orchestrator-api-config

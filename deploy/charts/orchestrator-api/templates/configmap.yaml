apiVersion: v1
kind: ConfigMap
metadata:
  name: diploma-orchestrator-api-config
  namespace: {{ .Release.Namespace }}
data:
  ORCHESTRATOR_DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  ORCHESTRATOR_KUBECONFIG: {{ .Values.config.kubeconfigPath | quote }}
  ORCHESTRATOR_BACKUP_CHART_PATH: {{ .Values.config.backupChartPath | quote }}
  ORCHESTRATOR_RELEASE_PREFIX: {{ .Values.config.releasePrefix | quote }}
  ORCHESTRATOR_ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}

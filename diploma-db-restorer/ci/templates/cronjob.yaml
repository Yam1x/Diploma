{{- if eq .Values.triggerMode "scheduled" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "{{ .Values.extraConfigMapEnvVars.BACKUPS_SCHEDULE }}"
  successfulJobsHistoryLimit: 20
  failedJobsHistoryLimit: 20
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: {{ .Release.Name }}
              {{- if .Values.image.registry }}
              image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
              {{- else }}
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              {{- end }}
              resources:
                limits:
                  cpu: {{ .Values.resources.limits.cpu }}
                  memory: {{ .Values.resources.limits.memory }}
                requests:
                  cpu: {{ .Values.resources.requests.cpu }}
                  memory: {{ .Values.resources.requests.memory }}
              env:
                - name: DB_BACKUPS_FILENAME_PREFIX
                  value: {{ .Values.extraConfigMapEnvVars.DB_BACKUPS_FILENAME_PREFIX }}
                - name: SOURCE_DB_AWS_ENDPOINT
                  value: {{ .Values.extraConfigMapEnvVars.SOURCE_DB_AWS_ENDPOINT }}
                - name: SOURCE_DB_AWS_ACCESS_KEY_ID
                  value: {{ .Values.extraConfigMapEnvVars.SOURCE_DB_AWS_ACCESS_KEY_ID }}
                - name: SOURCE_DB_AWS_SECRET_ACCESS_KEY
                  value: {{ .Values.extraConfigMapEnvVars.SOURCE_DB_AWS_SECRET_ACCESS_KEY }}
                - name: SOURCE_DB_AWS_BUCKET_NAME
                  value: {{ .Values.extraConfigMapEnvVars.SOURCE_DB_AWS_BUCKET_NAME }}
                - name: TARGET_DATABASE_HOST
                  value: {{ .Values.extraConfigMapEnvVars.TARGET_DATABASE_HOST }}
                - name: TARGET_DATABASE_USERNAME
                  value: {{ .Values.extraConfigMapEnvVars.TARGET_DATABASE_USERNAME }}
                - name: TARGET_DATABASE_PASSWORD
                  value: {{ .Values.extraConfigMapEnvVars.TARGET_DATABASE_PASSWORD }}
                - name: TARGET_DATABASE_NAME
                  value: {{ .Values.extraConfigMapEnvVars.TARGET_DATABASE_NAME }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  triggerMode: {{ .Values.triggerMode | quote }}
{{- end }}

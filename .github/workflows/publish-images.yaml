name: Publish Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: diploma-orchestrator-api
            context: .
            dockerfile: apps/orchestrator-api/Dockerfile
          - name: ui
            image: diploma-orchestrator-ui
            context: .
            dockerfile: apps/orchestrator-ui/Dockerfile
          - name: db-backupper
            image: diploma-db-backupper
            context: diploma-db-backupper
            dockerfile: diploma-db-backupper/Dockerfile
          - name: s3-backupper
            image: diploma-s3-backupper
            context: diploma-s3-backupper
            dockerfile: diploma-s3-backupper/Dockerfile
          - name: env-synchronizer
            image: diploma-env-synchronizer
            context: diploma-env-synchronizer
            dockerfile: diploma-env-synchronizer/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize GHCR owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
